<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Zoomable Vector Triangle (10D Projection)</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 12px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 {
      font-size: 1rem;
      margin: 0;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #2563eb;
    }
    .hint {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    canvas {
      flex: 1;
      cursor: grab;
      display: block;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>2D Triangle Spanned by 10D Vectors A, B, and C = A − B</h1>
      <span class="hint">Scroll wheel to Zoom • Click & Drag to Pan</span>
    </div>
    <div class="controls">
      <button id="zoomIn">Zoom In (+)</button>
      <button id="zoomOut">Zoom Out (−)</button>
      <button id="reset">Reset View</button>
    </div>
  </header>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Exact 2D projection coordinates of the 10D vectors
    const O = { x: 0, y: 0 };
    const B = { x: Math.sqrt(101), y: 0 };            // ≈ (10.0499, 0)
    const A = { x: Math.sqrt(101), y: 3 };            // ≈ (10.0499, 3)

    // Camera state
    let scale = 65; // pixels per unit
    let offsetX = 120;
    let offsetY = 0;

    // Dragging state
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    function resize() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      if (offsetY === 0) offsetY = canvas.height * 0.72;
      draw();
    }

    window.addEventListener("resize", resize);

    // Convert math coordinates to screen pixels
    function toScreen(pt) {
      return {
        x: offsetX + pt.x * scale,
        y: offsetY - pt.y * scale,
      };
    }

    // Convert screen pixels to math coordinates
    function toWorld(px, py) {
      return {
        x: (px - offsetX) / scale,
        y: (offsetY - py) / scale,
      };
    }

    function drawArrow(from, to, color, width = 3) {
      const p1 = toScreen(from);
      const p2 = toScreen(to);
      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const headLen = 12;

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();

      // Arrowhead
      ctx.beginPath();
      ctx.moveTo(p2.x, p2.y);
      ctx.lineTo(
        p2.x - headLen * Math.cos(angle - Math.PI / 6),
        p2.y - headLen * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        p2.x - headLen * Math.cos(angle + Math.PI / 6),
        p2.y - headLen * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
    }

    function drawGrid() {
      const topLeft = toWorld(0, 0);
      const bottomRight = toWorld(canvas.width, canvas.height);

      // Adaptive grid spacing based on zoom level
      let step = 1;
      if (scale < 25) step = 2;
      if (scale < 10) step = 5;
      if (scale > 150) step = 0.5;
      if (scale > 350) step = 0.2;

      ctx.lineWidth = 1;
      ctx.font = "12px system-ui";
      ctx.fillStyle = "#64748b";

      const startX = Math.floor(topLeft.x / step) * step;
      const endX = Math.ceil(bottomRight.x / step) * step;
      for (let x = startX; x <= endX; x += step) {
        const sx = toScreen({ x, y: 0 }).x;
        ctx.strokeStyle = Math.abs(x) < 1e-6 ? "#475569" : "#1e293b";
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx, canvas.height);
        ctx.stroke();

        if (Math.abs(x) > 1e-6) {
          ctx.fillText(Number(x.toFixed(2)), sx + 4, offsetY + 15);
        }
      }

      const startY = Math.floor(bottomRight.y / step) * step;
      const endY = Math.ceil(topLeft.y / step) * step;
      for (let y = startY; y <= endY; y += step) {
        const sy = toScreen({ x: 0, y }).y;
        ctx.strokeStyle = Math.abs(y) < 1e-6 ? "#475569" : "#1e293b";
        ctx.beginPath();
        ctx.moveTo(0, sy);
        ctx.lineTo(canvas.width, sy);
        ctx.stroke();

        if (Math.abs(y) > 1e-6) {
          ctx.fillText(Number(y.toFixed(2)), offsetX + 6, sy - 4);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      const sO = toScreen(O);
      const sB = toScreen(B);
      const sA = toScreen(A);

      // Shaded triangle interior
      ctx.fillStyle = "rgba(59, 130, 246, 0.12)";
      ctx.beginPath();
      ctx.moveTo(sO.x, sO.y);
      ctx.lineTo(sB.x, sB.y);
      ctx.lineTo(sA.x, sA.y);
      ctx.closePath();
      ctx.fill();

      // Right-angle square marker at B
      const boxSize = Math.min(18, scale * 0.35);
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(sB.x - boxSize, sB.y - boxSize, boxSize, boxSize);

      // Angle arc theta at Origin O
      const theta = Math.atan2(3, Math.sqrt(101)); // ≈ 16.62°
      const arcRadius = Math.min(75, scale * 1.4);
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sO.x, sO.y, arcRadius, -theta, 0);
      ctx.stroke();

      // Angle label
      ctx.fillStyle = "#facc15";
      ctx.font = "bold 13px system-ui";
      ctx.fillText(
        "θ ≈ 16.62° (cos θ ≈ 0.9582)",
        sO.x + arcRadius + 10,
        sO.y - 10
      );

      // Draw the three vectors
      drawArrow(O, B, "#38bdf8", 3); // Vector B
      drawArrow(O, A, "#4ade80", 3); // Vector A
      drawArrow(B, A, "#f472b6", 3); // Difference Vector C = A - B

      // Side labels
      ctx.font = "bold 14px system-ui";
      ctx.fillStyle = "#38bdf8";
      ctx.fillText(
        "Vector B: ||B|| = √101 ≈ 10.05",
        (sO.x + sB.x) / 2 - 80,
        sB.y + 24
      );

      ctx.fillStyle = "#4ade80";
      ctx.fillText(
        "Vector A: ||A|| = √110 ≈ 10.49",
        (sO.x + sA.x) / 2 - 110,
        (sO.y + sA.y) / 2 - 14
      );

      ctx.fillStyle = "#f472b6";
      ctx.fillText(
        "C = A − B: ||C|| = 3",
        sB.x + 12,
        (sB.y + sA.y) / 2
      );

      // Vertex dots & coordinates
      const vertices = [
        { pt: sO, label: "O (0, 0)", dx: -25, dy: 20 },
        { pt: sB, label: "Tip of B (10.05, 0)", dx: -40, dy: 22 },
        { pt: sA, label: "Tip of A (10.05, 3.00)", dx: -50, dy: -12 },
      ];

      vertices.forEach((v) => {
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(v.pt.x, v.pt.y, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#cbd5e1";
        ctx.font = "12px system-ui";
        ctx.fillText(v.label, v.pt.x + v.dx, v.pt.y + v.dy);
      });
    }

    // Zoom centered on mouse cursor
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
      const mouseWorldBefore = toWorld(e.offsetX, e.offsetY);

      scale = Math.max(8, Math.min(2000, scale * zoomFactor));

      offsetX = e.offsetX - mouseWorldBefore.x * scale;
      offsetY = e.offsetY + mouseWorldBefore.y * scale;
      draw();
    });

    // Panning with mouse drag
    canvas.addEventListener("mousedown", (e) => {
      isDragging = true;
      dragStart = { x: e.clientX - offsetX, y: e.clientY - offsetY };
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      offsetX = e.clientX - dragStart.x;
      offsetY = e.clientY - dragStart.y;
      draw();
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    // Button controls
    document.getElementById("zoomIn").onclick = () => {
      scale = Math.min(2000, scale * 1.25);
      draw();
    };
    document.getElementById("zoomOut").onclick = () => {
      scale = Math.max(8, scale * 0.8);
      draw();
    };
    document.getElementById("reset").onclick = () => {
      scale = 65;
      offsetX = 120;
      offsetY = canvas.height * 0.72;
      draw();
    };

    resize();
  </script>
</body>
</html>
